plugins {
    id 'com.android.library'
    id 'maven-publish'
}

repositories {
    mavenCentral()
    google()
}

android {
    namespace = "io.approov.service.grpc"
    compileSdkVersion 34

    buildFeatures {
        // AGP 8 disables BuildConfig generation by default; we need it to expose
        // the service-layer version to runtime code (see APPROOV_SERVICE_VERSION below).
        buildConfig true
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 34
        
        // The published service-layer version, fed by CI from the release git tag
        // (-PapproovServiceVersion=X.Y.Z). Local/test builds get "dev". This is the
        // single source of truth for the version baked into the compiled AAR.
        def serviceVersion = (project.findProperty('approovServiceVersion') ?: 'dev')
        buildConfigField "String", "APPROOV_SERVICE_VERSION", "\"${serviceVersion}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Testing requirement: Configure Robolectric test runner.
    // This is a testing requirement and has no production dependency at all.
    testOptions {
        unitTests {
            includeAndroidResources = false
            returnDefaultValues = true
        }
    }

    // Testing requirement: Exclude integration tests if local mini-sdk project dependencies are not included.
    // This is a testing requirement and has no production dependency at all.
    sourceSets {
        test {
            java {
                if (findProject(':approov-sdk') == null || findProject(':test-support') == null) {
                    exclude '**/ApproovServiceMiniSdkTest.java'
                }
            }
        }
    }
}

configurations {
    // Testing requirement: Exclude standard Android SDK in testImplementation to avoid conflicts with mini-sdk mock.
    testImplementation {
        exclude group: 'io.approov', module: 'approov-android-sdk'
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'io.approov:approov-android-sdk:3.5.3'
    implementation 'io.grpc:grpc-okhttp:1.60.0'

    // Testing dependencies: Robolectric, JUnit, and JSON helper classes.
    // These are testing requirements and have no production dependency at all.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'org.json:json:20231013'
    testImplementation 'androidx.test:core:1.6.1'

    // Testing dependencies: Include local mock approov-sdk and test-support if available.
    // These are testing requirements and have no production dependency at all.
    if (findProject(':approov-sdk') != null) {
        testImplementation project(':approov-sdk')
    }
    if (findProject(':test-support') != null) {
        testImplementation project(':test-support')
    }
}
